# Host opt-ins for the wp-coding-agents install on the Extra Chill VPS.
#
# The agent self-upgrade (sudo wp-coding-agents-upgrade start) reads this file
# from the merged main branch through a root-owned mirror — never from a disk
# the agent can write — so a setting here takes effect only after a reviewed
# merge. KEY=value lines; keys are allowlisted by wp-coding-agents (#799).
# Removing a key turns its feature off on the next self-upgrade.

# Native app / WordPress chat routes to the Roadie-backed coding agent
# (wp-coding-agents #772/#773/#784). Access stays limited to the agent's
# WordPress access grants (owner + operators).
WORDPRESS_CHAT_AGENT=extra-chill-bot
