name: extrachill-link-pages / Required checks

on:
  pull_request:
    paths:
      - 'plugins/extrachill-link-pages/*.php'
      - 'plugins/extrachill-link-pages/inc/**/*.php'
      - 'plugins/extrachill-link-pages/templates/**/*.php'
      - 'plugins/extrachill-link-pages/assets/**/*.css'
      - 'plugins/extrachill-link-pages/assets/**/*.js'
      - 'plugins/extrachill-link-pages/tests/**/*.php'
      - 'plugins/extrachill-link-pages/tests/**/*.js'
      - 'plugins/extrachill-link-pages/src/**/*.js'
      - 'plugins/extrachill-link-pages/src/**/*.scss'
      - 'plugins/extrachill-link-pages/package.json'
      - 'plugins/extrachill-link-pages/package-lock.json'
      - 'plugins/extrachill-link-pages/tools/composer.json'
      - 'plugins/extrachill-link-pages/tools/composer.lock'
      - 'plugins/extrachill-link-pages/phpunit.xml.dist'
      - 'plugins/extrachill-link-pages/phpcs.xml.dist'
      - 'plugins/extrachill-link-pages/homeboy.json'
      - 'plugins/extrachill-link-pages/.buildignore'
      - '.github/workflows/extrachill-link-pages-required-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: plugins/extrachill-link-pages

jobs:
  required-checks:
    name: extrachill-link-pages PHP, tests, and package contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install development dependencies
        run: composer install --working-dir=tools --no-interaction --no-progress --prefer-dist

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate development Composer project
        run: composer validate --working-dir=tools --strict

      - name: Check runtime PHP syntax
        run: |
          php -l extrachill-link-pages.php
          for file in inc/*.php templates/*.php templates/components/*.php; do
            php -l "$file"
          done

      - name: Run WordPress coding standards
        run: composer --working-dir=tools lint:php

      - name: Run standalone tests and package contract
        run: composer --working-dir=tools test

      - name: Run public asset contract tests
        run: npm test
