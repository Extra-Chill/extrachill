name: extrachill-newsletter / Docs Agent

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the bootstrap without starting a live agent run'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  extrachill-newsletter-docs-agent:
    uses: Automattic/docs-agent/.github/workflows/maintain-docs.yml@main
    with:
      audience: user
      run_kind: bootstrap
      base_ref: main
      docs_branch: docs-agent/extrachill-newsletter-user-docs
      writable_paths: plugins/extrachill-newsletter/docs/user/**
      context_repositories: '[]'
      bootstrap_contract: >-
        {"required_globs":[{"pattern":"plugins/extrachill-newsletter/docs/user/**/*.md","min":2}],"forbidden_phrases":["following users"]}
      drift_checks: >-
        [{"command": "php plugins/extrachill-docs/scripts/check-user-docs-voice.php plugins/extrachill-newsletter/docs/user", "description": "Extra Chill writing rules: no software, vendor, developer or code terms and no follow feature in end-user help (plugins/extrachill-docs/runner-configs/writing-rules.md)"}]
      prompt: >-
        This repository is the Extra Chill monorepo; document only the plugin at plugins/extrachill-newsletter/ and write only under plugins/extrachill-newsletter/docs/user/. Follow plugins/extrachill-docs/runner-configs/writing-rules.md in this repository verbatim as the network's voice standard: use plain language, lead with the benefit, and do not name plugins, tools, or vendors. Write for newsletter subscribers managing preferences and artists or organizers sending newsletters. Extra Chill has no follow feature or follower graph; never describe following users. There is no existing published help content for this platform to seed, so this is a true bootstrap. Ground all help in current product behavior.
      model: gpt-6-luna
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXTERNAL_PACKAGE_SOURCE_POLICY: ${{ secrets.DOCS_AGENT_EXTERNAL_PACKAGE_SOURCE_POLICY }}
