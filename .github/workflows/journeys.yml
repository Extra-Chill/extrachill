name: Network journeys

# User-journey regression tests on the full 11-site network rig
# (rigs/extrachill-network, journey contract extrachill-network#291).
#
# Each selected journey boots the whole network from this monorepo checkout
# (every plugin under plugins/, the theme under themes/; components outside
# the monorepo from their latest release), walks a real browser journey, and
# runs its grade.php.
# A grade fails the run when a finding appears that is not pinned to an
# open issue, or when a pinned finding starts passing (unpin it so the case
# guards the fix). Known-open findings do not fail the run.
#
# This is deliberately separate from deploy.yml's pre-deploy gate: journeys
# take ~15 minutes each and judge product behaviour, not whether the
# component combination boots.

on:
  schedule:
    - cron: '23 9 * * *'
  pull_request:
    paths:
      - 'plugins/**'
      - 'themes/**'
      - 'packages/**'
      - 'rigs/extrachill-network/**'
      - '.github/workflows/journeys.yml'
      # Docs and unit tests can't change what a journey sees, so a PR that
      # only touches them skips the network boot. Order matters: later
      # patterns override earlier ones. tests/e2e/ stays in because journeys
      # load fixtures from it (auth-multisite).
      - '!**/*.md'
      - '!**/docs/**'
      - '!**/tests/**'
      - '**/tests/e2e/**'
  workflow_dispatch:
    inputs:
      journeys:
        description: 'JSON array of journey IDs (default: every regression journey below).'
        required: false
        default: ''
      demo:
        description: 'Render selected journeys as instructional MP4 demos.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: network-journeys-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: floating refs make journey failures unattributable.
  WP_CODEBOX_REF: v0.33.2
  DEFAULT_JOURNEYS: '["musician-link-page-onboarding","returning-artist-link-page","anonymous-event-submission","show-ratings-fan"]'

jobs:
  # One runner per journey: each boots its own network, so wall time is the
  # slowest journey instead of the sum of all of them (#428).
  plan:
    name: Select journeys
    runs-on: ubuntu-latest
    outputs:
      journeys: ${{ steps.select.outputs.journeys }}
    steps:
      - id: select
        env:
          JOURNEYS: ${{ inputs.journeys }}
        run: |
          set -euo pipefail
          journeys="$(jq -c . <<<"${JOURNEYS:-$DEFAULT_JOURNEYS}")"
          jq -e 'type == "array" and length > 0 and all(type == "string")' <<<"${journeys}" >/dev/null \
            || { echo "::error::journeys must be a non-empty JSON array of journey IDs, got: ${journeys}"; exit 1; }
          echo "journeys=${journeys}" >> "${GITHUB_OUTPUT}"

  journey:
    name: Journey ${{ matrix.journey }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        journey: ${{ fromJSON(needs.plan.outputs.journeys) }}
    # Setup (theme build, WP Codebox build, Chromium) + the rig's 50m
    # recipe-run --timeout + summary/upload headroom.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Checkout WP Codebox
        uses: actions/checkout@v6
        with:
          repository: Automattic/wp-codebox
          ref: ${{ env.WP_CODEBOX_REF }}
          path: .ci/wp-codebox

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Demo mode encodes H.264 MP4s (rigs/extrachill-network/run.mjs
      # renderJourneyDemos); the runner image ships no ffmpeg.
      - name: Install ffmpeg for demo rendering
        if: ${{ inputs.demo == true }}
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null && ffmpeg -version | head -1

      - name: Build WP Codebox and its pinned Chromium
        working-directory: .ci/wp-codebox
        run: |
          set -euo pipefail
          npm install
          npm run build
          npx playwright install --with-deps chromium

      - name: Validate rig contracts
        run: node rigs/extrachill-network/tests/contract.test.mjs

      # Built outputs (build/, vendor/, generated CSS) for every monorepo
      # component, content-addressed by each component's tracked files, so a
      # PR rebuilds only the components it changed. A few MB; node_modules is
      # never cached. The rig prunes it to this run's entries before save.
      - name: Restore component build cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/rig-build-cache
          key: rig-component-builds-v1-${{ github.sha }}
          restore-keys: rig-component-builds-v1-

      - name: Boot the network and run journeys
        env:
          HOMEBOY_WP_CODEBOX_BIN: ${{ github.workspace }}/.ci/wp-codebox/packages/cli/dist/index.js
          HOMEBOY_ARTIFACT_ROOT: ${{ runner.temp }}/journeys/artifacts
          HOMEBOY_NETWORK_RESULT_FILE: ${{ runner.temp }}/journeys/result.json
          JOURNEY: ${{ matrix.journey }}
          DEMO: ${{ inputs.demo }}
        run: |
          set -euo pipefail
          export HOMEBOY_SETTINGS_JSON="$(jq -cn --arg journey "${JOURNEY}" \
            --arg monorepo "${{ github.workspace }}" \
            --argjson demo "${DEMO:-false}" \
            --arg cache "${{ runner.temp }}/rig-build-cache" \
            '{extrachill_monorepo_source: $monorepo, extrachill_journeys: [$journey], extrachill_demo: $demo, extrachill_build_cache: $cache}')"
          echo "Settings: ${HOMEBOY_SETTINGS_JSON}"
          node rigs/extrachill-network/run.mjs > /dev/null

      - name: Save component build cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/rig-build-cache
          key: rig-component-builds-v1-${{ github.sha }}

      - name: Summarize journey results
        if: always()
        run: |
          set -euo pipefail
          result="${{ runner.temp }}/journeys/result.json"
          [ -f "${result}" ] || { echo "No rig result was written." >> "${GITHUB_STEP_SUMMARY}"; exit 0; }
          # tee: the table also lands in the job log, not only the step summary.
          node - "${result}" "${{ runner.temp }}/journeys/artifacts/component-builds.json" <<'NODE' | tee -a "${GITHUB_STEP_SUMMARY}"
          const fs = require('node:fs');
          const envelope = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const out = [];
          let failed = false;

          // Journey steps are isolated (allowFailure), so the recipe keeps
          // going when one journey breaks. Browser-step failures are judged by
          // each journey's grade; a crashed seed/grade/PHP step means that
          // journey could not be judged at all, which fails the run.
          const crashes = {};
          for (const f of [...(envelope.stepFailures ?? []), ...(envelope.advisoryFailures ?? [])]) {
            const meta = f.metadata ?? {};
            const journey = meta.journey;
            if (!journey || f.command === 'wordpress.browser-actions') continue;
            (crashes[journey] ??= new Set()).add(`${meta.kind ?? f.command}: ${String(f.error?.message ?? '').split('\n').find((l) => /Fatal error|Exception|failed/.test(l)) ?? ''}`.slice(0, 300));
          }
          if (Object.keys(crashes).length) {
            failed = true;
            out.push('## Journeys that crashed', '');
            for (const [journey, messages] of Object.entries(crashes)) {
              out.push(`- **${journey}**`, ...[...messages].map((m) => `  - ${m.replace(/<[^>]+>/g, '')}`));
            }
            out.push('');
          }

          for (const execution of envelope.executions ?? []) {
            for (const match of String(execution.stdout ?? '').matchAll(/EXTRACHILL_JOURNEY_RESULT:([A-Za-z0-9+/=]+)/g)) {
              let result;
              try { result = JSON.parse(Buffer.from(match[1], 'base64').toString('utf8')); } catch { continue; }
              out.push(`## ${result.schema ?? result.scenario ?? 'journey'}`, '');
              if (Array.isArray(result.results)) {
                out.push('| Case | Outcome | Pinned issue |', '| --- | --- | --- |');
                for (const r of result.results) out.push(`| ${r.id} | ${r.outcome} | ${r.pinned_issue ?? ''} |`);
              } else if (typeof result.passed === 'number') {
                out.push(`${result.passed} of ${result.assertions ?? '?'} assertions passed (legacy result format, informational).`);
              }
              if (result.regressions?.length) { failed = true; out.push('', `**New findings:** ${result.regressions.join(', ')}`); }
              if (result.unpin?.length) { failed = true; out.push('', `**Fixed, unpin in grade.php:** ${result.unpin.join(', ')}`); }
              out.push('');
            }
          }
          const judged = out.length > 0;
          out.push(...timingSummary(envelope, process.argv[3]));
          console.log(judged ? out.join('\n') : ['No journey results were found (the boot may have failed before any journey ran).', ...out].join('\n'));
          if (!judged || failed) process.exitCode = 1;

          // Where the wall clock went: component builds (written by run.mjs),
          // the rig's boot phases, then each journey's own steps. Informational
          // only; never changes the outcome.
          function timingSummary(envelope, buildsFile) {
            const seconds = (ms) => { const t = Math.round(ms / 1000); return t < 60 ? `${t}s` : `${Math.floor(t / 60)}m${String(t % 60).padStart(2, '0')}s`; };
            const rows = [];
            let builds;
            try { builds = JSON.parse(fs.readFileSync(buildsFile, 'utf8')); } catch {}
            if (builds) {
              const cached = builds.components.filter((c) => c.status === 'cached').length;
              const slowest = builds.components.filter((c) => c.status !== 'cached').sort((a, b) => b.durationMs - a.durationMs).slice(0, 4).map((c) => `${c.slug} ${seconds(c.durationMs)}`).join(', ');
              rows.push(['Component builds', seconds(builds.wallMs), `${builds.components.length - cached} built, ${cached} from cache${slowest ? `; slowest: ${slowest}` : ''}`]);
            }
            for (const phase of envelope.phaseEvidence ?? []) {
              if (phase.name !== 'run_workloads' && (phase.durationMs ?? 0) >= 1000) rows.push([`Rig: ${phase.name}`, seconds(phase.durationMs), '']);
            }
            const stepMs = (e) => e.diagnostics?.timing?.durationMs ?? e.result?.diagnostics?.timing?.durationMs ?? 0;
            const groups = new Map();
            for (const e of envelope.executions ?? []) {
              const name = e.recipeStepMetadata?.journey ?? '(network setup and probes)';
              const g = groups.get(name) ?? { ms: 0, steps: 0 };
              g.ms += stepMs(e); g.steps += 1; groups.set(name, g);
            }
            for (const [name, g] of [...groups].sort((a, b) => b[1].ms - a[1].ms)) rows.push([name, seconds(g.ms), `${g.steps} steps`]);
            if (!rows.length) return [];
            const actions = [];
            for (const e of envelope.executions ?? []) {
              for (const step of e.result?.json?.steps ?? []) {
                if (step?.kind === 'screenshot') continue;
                const target = step.selector ?? step.url ?? (step.waitFor === 'duration' ? `sleep ${step.duration}` : step.waitFor) ?? '';
                actions.push({ ms: step.durationMs ?? 0, label: `${e.recipeStepMetadata?.journey ?? 'setup'}: ${step.kind} ${String(target).slice(0, 80)}` });
              }
            }
            const top = actions.sort((a, b) => b.ms - a.ms).slice(0, 8);
            return [
              '## Timing', '',
              '| Phase | Time | Notes |', '| --- | --- | --- |',
              ...rows.map((r) => `| ${r.join(' | ')} |`),
              '',
              ...(top.length ? ['Slowest browser actions:', '', ...top.map((a) => `- ${seconds(a.ms)} ${a.label.replace(/\|/g, '\\|')}`), ''] : []),
            ];
          }
          NODE

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-journeys-${{ matrix.journey }}
          path: |
            ${{ runner.temp }}/journeys/result.json
            ${{ runner.temp }}/journeys/artifacts/component-builds.json
            ${{ runner.temp }}/journeys/artifacts/runtime-*/files/browser/
            rigs/extrachill-network/evidence/demo/
          if-no-files-found: warn
          retention-days: 14

  # One stable check name for the whole set, whatever journeys ran.
  result:
    name: Journeys on the network rig
    needs: [plan, journey]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          JOURNEYS: ${{ needs.journey.result }}
        run: |
          echo "plan=${PLAN} journeys=${JOURNEYS}"
          [ "${PLAN}" = success ] && [ "${JOURNEYS}" = success ]
