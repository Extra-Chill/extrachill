name: Homeboy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: homeboy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The reusable ci.yml workflow requests contents:write, pull-requests:write,
# and issues:write for PR comments. GitHub
# rejects the whole run at startup if the caller does not grant a scope the
# callee asks for, so these must match ci.yml's own `permissions:` block.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  homeboy:
    uses: Extra-Chill/homeboy-action/.github/workflows/ci.yml@v2
    with:
      extension: wordpress
      # Scoped to what homeboy.json's self_checks actually declares (lint,
      # test), per issue #197.
      commands: review lint,review test
      # Full scope, not auto. Changed-scope selects zero tests when a PR
      # only touches CI/harness config, and the runner correctly refuses to
      # certify a harness change that never exercised the harness
      # (changed_scope_zero_tests_for_harness_change). Full scope always
      # exercises the whole suite; differential gating below is what stops
      # the pre-existing PHPCS/ESLint/PHPStan baseline from blocking
      # unrelated PRs.
      scope: full
      differential-gating: 'true'
      baseline-commands: auto
    secrets: inherit
