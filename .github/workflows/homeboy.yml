name: Homeboy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: homeboy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The reusable ci.yml workflow requests contents:write, pull-requests:write,
# and issues:write for PR comments. GitHub
# rejects the whole run at startup if the caller does not grant a scope the
# callee asks for, so these must match ci.yml's own `permissions:` block.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Monorepo CI: Homeboy detects which components (plugins/*, themes/*,
  # packages/*) the PR or push touched and runs each one's own lint and test
  # with its own homeboy.json, extensions and toolchain. Branch protection
  # requires the single aggregate `homeboy / Components` check.
  homeboy:
    uses: Extra-Chill/homeboy-action/.github/workflows/ci.yml@v2
    with:
      components: changed
      # A change to this workflow re-checks every component.
      shared-paths: '.github/workflows/homeboy.yml'
      # No `extension:` override: each component installs and runs the
      # extensions its own homeboy.json declares (wordpress for plugins and
      # the theme, nodejs for packages/*, both for community).
      commands: review lint,review test
      # Full scope per component, not auto: changed-scope selects zero tests
      # when a change only touches CI/harness config (#197). Differential
      # gating keeps each component's pre-existing baseline from blocking.
      scope: full
      differential-gating: 'true'
      baseline-commands: auto
    secrets: inherit

  # Site-level infrastructure is not a component: deploy config, the
  # monorepo deploy planner, nginx/sunrise artifacts, the network rig and
  # the generated MONOREPO.md site map.
  site:
    name: Site infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy and server artifacts
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          php -l deploy/sunrise.php
          php deploy/tests/deploy-workflow-smoke.php
          php deploy/tests/sunrise-cutover-smoke.php
          php deploy/tests/nginx-login-no-redirect-smoke.php
          python3 deploy/tests/deploy-monorepo-test.py
      - name: Network rig contracts
        run: node --test rigs/extrachill-network/tests/*.test.mjs
      - name: MONOREPO.md site map is current
        run: node tools/site-map.mjs --check
      - name: Documentation index covers every component
        run: node tools/check-docs-index.mjs
