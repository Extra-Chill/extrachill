name: Release

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

# Monorepo releases (homeboy-action#555): every merge releases each component
# with unreleased commits since its own `<id>-vX.Y.Z` tag, serially in one job,
# each with its own version bump, changelog and GitHub Release. Components with
# nothing to release are skipped, and a component missed by one run is picked
# up by the next. Deploys are separate: deploy-monorepo.yml ships the merged
# commit for the changed components.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview the releases without making changes'
        type: boolean
        default: false
      component:
        description: 'Release only the component at this path (e.g. packages/api-client). Empty releases every changed component.'
        type: string
        default: ''
      bump:
        description: 'Explicit bump for that component: major, minor, patch or X.Y.Z. Needed when breaking commits are held back with major-requires-flag.'
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: Extra-Chill/homeboy-action/.github/workflows/release.yml@v2
    with:
      # A manual run with a component releases just that component, with
      # an explicit bump (--force-lower-bump lets a 0.x breaking change ship
      # as a minor). Every other run releases all changed components.
      components: ${{ inputs.component == '' && 'all' || '' }}
      component: ${{ inputs.component }}
      args: ${{ inputs.component && inputs.bump && format('--bump {0} --force-lower-bump', inputs.bump) || '' }}
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
