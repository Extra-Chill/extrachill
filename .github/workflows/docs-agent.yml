name: Docs Agent

on:
  workflow_dispatch:
    inputs:
      component:
        description: Plugin to document
        type: choice
        required: true
        options:
          - extrachill-artist-platform
          - extrachill-blog
          - extrachill-community
          - extrachill-events
          - extrachill-newsletter
          - extrachill-shop
          - extrachill-users
      dry_run:
        description: Validate the run without starting a live agent run
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      config: ${{ steps.config.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install platform map parser
        run: python -m pip install PyYAML==6.0.3
      - name: Resolve component configuration
        id: config
        env:
          COMPONENT: ${{ inputs.component }}
        run: python plugins/extrachill-docs/scripts/docs-agent-config.py "$COMPONENT" >> "$GITHUB_OUTPUT"

  docs-agent:
    needs: config
    # Full main commit: v0.3.0 lacks dry_run, model and source_delta inputs;
    # 1f576e6 adds the optional PUBLISH_TOKEN (Automattic/docs-agent#184);
    # 07f990b runs on WP Codebox v0.33.4, which fails loudly on lost writes
    # (Automattic/docs-agent#185, Automattic/wp-codebox#2567); 4897641 raises
    # the agent turn budget from 12 to 40 (Automattic/docs-agent#186); e227ea8
    # makes WP Codebox honor it (v0.33.5, Automattic/docs-agent#187);
    # cbac654 bounds user-docs discovery so pages are written incrementally
    # (Automattic/docs-agent#188) and runs on WP Codebox v0.33.6, which always
    # reports why an agent runtime failed (Automattic/docs-agent#189);
    # fcc284b makes maintenance keep accurate content and concrete values
    # (Automattic/docs-agent#191), titles PRs docs(<component>): ... via
    # docs_scope, and runs on WP Codebox v0.33.7: the docs branch is used as
    # given and workspace_git_status/diff work (Automattic/docs-agent#192,
    # Automattic/wp-codebox#2592); 4ec7594 keeps documented values the source
    # reads from settings, such as fee rates (Automattic/docs-agent#193, #194).
    # Runner guide: plugins/extrachill-docs/docs/docs-agent-runner.md
    # This is the sole Docs Agent pin; update here after reviewing upstream changes.
    uses: Automattic/docs-agent/.github/workflows/maintain-docs.yml@4ec75944fe9802d9706f8c18ab866403c7d993f9
    with:
      audience: ${{ fromJSON(needs.config.outputs.config).audience }}
      run_kind: ${{ fromJSON(needs.config.outputs.config).run_kind }}
      base_ref: ${{ fromJSON(needs.config.outputs.config).base_ref }}
      docs_branch: ${{ fromJSON(needs.config.outputs.config).docs_branch }}
      docs_scope: ${{ inputs.component }}
      writable_paths: ${{ fromJSON(needs.config.outputs.config).writable_paths }}
      context_repositories: ${{ toJSON(fromJSON(needs.config.outputs.config).context_repositories) }}
      bootstrap_contract: ${{ toJSON(fromJSON(needs.config.outputs.config).bootstrap_contract) }}
      source_delta: ${{ toJSON(fromJSON(needs.config.outputs.config).source_delta) }}
      drift_checks: ${{ toJSON(fromJSON(needs.config.outputs.config).drift_checks) }}
      prompt: ${{ fromJSON(needs.config.outputs.config).prompt }}
      model: ${{ fromJSON(needs.config.outputs.config).model }}
      max_turns: ${{ fromJSON(needs.config.outputs.config).max_turns }}
      dry_run: ${{ inputs.dry_run }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXTERNAL_PACKAGE_SOURCE_POLICY: ${{ secrets.DOCS_AGENT_EXTERNAL_PACKAGE_SOURCE_POLICY }}
      # Fine-grained PAT (machine account, this repo only). PRs opened with
      # github.token never trigger pull_request CI; unset falls back to it.
      PUBLISH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
