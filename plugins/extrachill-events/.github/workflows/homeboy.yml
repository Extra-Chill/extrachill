name: Homeboy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: homeboy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  homeboy:
    name: Homeboy (${{ matrix.command }})
    runs-on: ubuntu-latest
    env:
      LINK_PAGES_WORKTREE: ${{ github.workspace }}/.ci/extrachill-link-pages
    strategy:
      fail-fast: false
      matrix:
        command: [review lint, review test]
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: ''
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: homeboy_wptests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout Extra Chill Events
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Checkout Data Machine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Extra-Chill/data-machine
          ref: cbd6b42b7f5c978c1ea09df5a74a6be5c228fb20
          path: .ci/data-machine

      - name: Checkout Data Machine Events
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Extra-Chill/data-machine-events
          ref: efd7579fab38beb73f6961fc33da538a8f112d93
          path: .ci/data-machine-events

      - name: Checkout Extra Chill Link Pages dependency
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Extra-Chill/extrachill-link-pages
          ref: 04b61a0f305deecd7ad588be64c263b6726a7e7b
          path: .ci/extrachill-link-pages

      - name: Checkout Extra Chill Network
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Extra-Chill/extrachill-network
          ref: bd7e73a69d20b05515cad9d2101220f84e25c176
          path: .ci/extrachill-network

      - name: Checkout Extra Chill Users
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Extra-Chill/extrachill-users
          ref: 346889fb9563138a0ec231dc0ac30d484e83bdc5
          path: .ci/extrachill-users

      - name: Checkout Homeboy Extensions adapter fix
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Extra-Chill/homeboy-extensions
          ref: 3da3634d1b85e536bb33315a9b722b7d02468c39
          path: .ci/homeboy-extensions

      - name: Record MySQL readiness and version
        run: |
          mysqladmin --host=127.0.0.1 --user=root ping
          mysql --host=127.0.0.1 --user=root --skip-column-names --execute='SELECT VERSION();'

      - name: Prepare pinned Homeboy binary
        run: |
          mkdir -p "${RUNNER_TEMP}/homeboy-0.367.6"
          curl --fail --silent --show-error --location \
            'https://github.com/Extra-Chill/homeboy/releases/download/v0.367.6/homeboy-x86_64-unknown-linux-gnu.tar.xz' \
            --output "${RUNNER_TEMP}/homeboy-0.367.6.tar.xz"
          printf '%s  %s\n' \
            '4e918a6b870351ff824947251b9c7611d0570ded6d48a9186227d1352ae9e54c' \
            "${RUNNER_TEMP}/homeboy-0.367.6.tar.xz" | sha256sum --check --strict
          tar --extract --xz --file "${RUNNER_TEMP}/homeboy-0.367.6.tar.xz" \
            --directory "${RUNNER_TEMP}/homeboy-0.367.6" --strip-components=1
          chmod +x "${RUNNER_TEMP}/homeboy-0.367.6/homeboy"

      - name: Install Data Machine dependencies
        working-directory: .ci/data-machine
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --classmap-authoritative

      - name: Install test dependencies
        if: ${{ matrix.command == 'review test' }}
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node.js
        if: ${{ matrix.command == 'review test' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build block assets for tests
        if: ${{ matrix.command == 'review test' }}
        run: |
          npm ci
          npm run build

      - name: Run isolated unit tests
        if: ${{ matrix.command == 'review test' }}
        run: |
          vendor/bin/phpunit --configuration phpunit-artist-unit.xml.dist
          vendor/bin/phpunit --configuration phpunit-venue-unit.xml.dist
          vendor/bin/phpunit --configuration phpunit-local-scene-unit.xml.dist
          vendor/bin/phpunit --configuration phpunit-network-block.xml.dist
          vendor/bin/phpunit --configuration phpunit-membership.xml.dist
          vendor/bin/phpunit --configuration phpunit-venue-calendar-feed.xml.dist

      - name: Assert Link Pages coordinated dependency entry
        if: ${{ matrix.command == 'review test' }}
        run: test -f .ci/extrachill-link-pages/extrachill-link-pages.php

      - name: Run coordinated Link Pages tests
        if: ${{ matrix.command == 'review test' }}
        run: |
          vendor/bin/phpunit --configuration phpunit.xml.dist tests/VenueLinkPagesCoordinatedRuntimeTest.php
          vendor/bin/phpunit --configuration phpunit.xml.dist tests/PromoterLinkPagesCoordinatedRuntimeTest.php

      - name: Select managed WordPress suite
        if: ${{ matrix.command == 'review test' }}
        run: cp phpunit-managed.xml.dist phpunit.xml.dist

      - name: Run Homeboy ${{ matrix.command }}
        env:
          HOMEBOY_SETTINGS_JSON: >-
            {"database_type":"mysql","validation_dependencies":["${{ github.workspace }}/.ci/data-machine","${{ github.workspace }}/.ci/data-machine-events","${{ github.workspace }}/.ci/extrachill-network","${{ github.workspace }}/.ci/extrachill-users"],"wp_codebox_multisite":true,"wp_codebox_phpunit_bootstrap_mode":"managed"}
          HOMEBOY_WP_CODEBOX_ARTIFACTS_DIR: ${{ github.workspace }}/wp-codebox-artifacts
          HOMEBOY_WP_CODEBOX_INSTALL_MODE: source
          HOMEBOY_WP_CODEBOX_REF: 82e02165dba2510ca04f5ce7e5a429804952404a
          HOMEBOY_WP_CODEBOX_SOURCE: https://github.com/Automattic/wp-codebox.git
          HOMEBOY_WORDPRESS_MULTISITE: '1'
          WP_CODEBOX_DB_HOST: 127.0.0.1
          WP_CODEBOX_DB_PORT: '3306'
          WP_CODEBOX_DB_USER: root
          WP_CODEBOX_DB_PASSWORD: ''
        uses: Extra-Chill/homeboy-action@beedc218296bf2b66b04794f669611abf4e7cc7f
        with:
          binary-path: ${{ runner.temp }}/homeboy-0.367.6/homeboy
          commands: ${{ matrix.command }}
          args: ${{ github.event_name == 'workflow_dispatch' && '--changed-since=origin/main' || '' }}
          auto-issue: ${{ github.event_name == 'workflow_dispatch' && 'false' || '' }}
          extension-source: ${{ github.workspace }}/.ci/homeboy-extensions
          expected-commands: review lint,review test

      - name: Record immutable managed runtime sources
        if: ${{ always() && matrix.command == 'review test' }}
        run: |
          mkdir -p wp-codebox-artifacts
          jq --null-input \
            --arg homeboy_version '0.367.6' \
            --arg homeboy_digest 'sha256:4e918a6b870351ff824947251b9c7611d0570ded6d48a9186227d1352ae9e54c' \
            --arg wp_codebox_sha '82e02165dba2510ca04f5ce7e5a429804952404a' \
            --arg mysql_image 'mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b' \
            '{schema:"extrachill-events/managed-runtime-sources/v1",homeboy:{version:$homeboy_version,artifact_digest:$homeboy_digest},wp_codebox:{source:"https://github.com/Automattic/wp-codebox.git",commit:$wp_codebox_sha},mysql:{provider:"external",image:$mysql_image}}' \
            > wp-codebox-artifacts/managed-runtime-source-evidence.json

      - name: Upload managed PHPUnit evidence
        if: ${{ always() && matrix.command == 'review test' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: managed-phpunit-evidence
          path: wp-codebox-artifacts
          if-no-files-found: error
