      prompt: "This repository is the Extra Chill monorepo; document only the plugin at plugins/extrachill-shop/ and write only under plugins/extrachill-shop/docs/user/. Read source only under plugins/extrachill-shop/ (plus the writing rules file below); never list or read the repository root, other plugins, or vendor, build or test directories. Start from the existing articles in plugins/extrachill-shop/docs/user/ and write each article as soon as you have grounded it, one topic at a time. Follow plugins/extrachill-docs/runner-configs/writing-rules.md in this repository verbatim as the network's voice standard: plain language, lead with the benefit, and never name plugins, tools, vendors, or anything technical. The Extra Chill shop is now open to everyone. Write for two readers. Buyers: browsing the shop, checking out (one seller per cart, US shipping only, agreeing to the Terms of Service at https://extrachill.com/terms-of-service/ and the Privacy Policy at https://extrachill.com/privacy-policy/ with the checkout checkbox; ticket buyers agree to the Terms of Service before going to the payment page), paying securely on the payment page, buying event tickets, tracking orders, and getting help with returns and refunds (each seller handles its own orders, shipping, returns, and support; see the Shipping & Returns page). Sellers, meaning artists, venues, and promoters: opening a shop from the shop manager, accepting the Seller Agreement at https://extrachill.com/seller-agreement/, connecting a payout account, adding products, shipping options and buying shipping labels, managing and fulfilling orders, refunds, selling event tickets, what Extra Chill charges and how payouts work, and that sellers are responsible for their own products and taxes. Extra Chill has no follow feature or follower graph; never describe following users. Keep the existing docs/user articles and their filenames; update them where the product has changed. Ground every article in current product behavior from the source under plugins/extrachill-shop/, reading fee and payout rules from the code rather than assuming them. Fee rates are network settings outside this plugin, with defaults of a 10% merch fee on the item price after discounts (not shipping), no fee on tickets for the seller (venues keep the full ticket price), and a buyer Service fee on tickets of $1 per ticket plus the card processing cost, grossed up so the seller nets exactly the ticket price; keep the documented rates, the worked $25 shirt example and its amounts, the worked $20 ticket example and its amounts, and the 30-day notice for fee increases unless the shop source shows different values."
      model: "gpt-6-luna"

