# Platform identity and Docs Agent configuration, keyed by monorepo plugin path.
# docs_subpath stays relative to the plugin for publishing and migration.
# runner is optional: only configured components appear in docs-agent.yml.
# Keep prompts, bootstrap contracts, writable paths and lane settings here.
# max_turns is optional (default 40); raise it only with run evidence.
# Legacy OWNER/REPO identities are derived by the PHP loader for existing pages.
plugins:

  plugins/extrachill-docs:
    platform_name: "Connect Your AI"
    parent_slug: "mcp"
    audience: "Extra Chill members connecting their own AI clients to network-wide capabilities"
    docs_subpath: "docs/user"

  plugins/extrachill-artist-platform:
    platform_name: "Artist Platform"
    parent_slug: "artist-platform"
    audience: "musicians, artist managers, and small label staff who run artist pages, link pages, merch stores, and roster management on extrachill.com"
    docs_subpath: "docs/user"
    runner:
      audience: "user"
      run_kind: "bootstrap"
      base_ref: "main"
      docs_branch: "docs-agent/extrachill-artist-platform-user-docs"
      writable_paths: "plugins/extrachill-artist-platform/docs/user/**"
      context_repositories: []
      bootstrap_contract: {"required_globs": [{"pattern": "plugins/extrachill-artist-platform/docs/user/*.md", "min": 9}], "forbidden_phrases": ["following users"]}
      drift_checks: [{"command": "php plugins/extrachill-docs/scripts/check-user-docs-voice.php plugins/extrachill-artist-platform/docs/user", "description": "Extra Chill writing rules: no software, vendor, developer or code terms and no follow feature in end-user help (plugins/extrachill-docs/runner-configs/writing-rules.md)"}]
      prompt: "This repository is the Extra Chill monorepo; document only the plugin at plugins/extrachill-artist-platform/ and write only under plugins/extrachill-artist-platform/docs/user/. Read source only under plugins/extrachill-artist-platform/ (plus the writing rules file below); never list or read the repository root, other plugins, or vendor, build or test directories. Start from the existing articles in plugins/extrachill-artist-platform/docs/user/ and write each article as soon as you have grounded it, one topic at a time. Follow plugins/extrachill-docs/runner-configs/writing-rules.md in this repository verbatim as the network's voice standard: plain language, lead with the benefit, and never name plugins, tools, vendors, or anything technical. Write for musicians, artist managers and small label staff running artist profiles, link pages, merch stores and rosters. Extra Chill has no follow feature or follower graph; never describe following users. Cover what the published Artist Platform help already covers so nothing is lost: getting started, managing link pages, advanced link page features, link page analytics, managing your roster, and artist access. Keep and improve the existing docs/user/artist-preferences.md. Ground every article in current product behavior from the source under plugins/extrachill-artist-platform/."
      model: "gpt-6-luna"

  plugins/extrachill-community:
    platform_name: "Community"
    parent_slug: "community"
    audience: "forum members, music fans, and contributors who use the discussion boards, profiles, ranks, upvoting, and notifications"
    docs_subpath: "docs/user"
    runner:
      audience: "user"
      run_kind: "bootstrap"
      base_ref: "main"
      docs_branch: "docs-agent/extrachill-community-user-docs"
      writable_paths: "plugins/extrachill-community/docs/user/**"
      context_repositories: []
      bootstrap_contract: {"required_globs": [{"pattern": "plugins/extrachill-community/docs/user/*.md", "min": 5}], "forbidden_phrases": ["following users"]}
      drift_checks: [{"command": "php plugins/extrachill-docs/scripts/check-user-docs-voice.php plugins/extrachill-community/docs/user", "description": "Extra Chill writing rules: no software, vendor, developer or code terms and no follow feature in end-user help (plugins/extrachill-docs/runner-configs/writing-rules.md)"}]
      prompt: "This repository is the Extra Chill monorepo; document only the plugin at plugins/extrachill-community/ and write only under plugins/extrachill-community/docs/user/. Read source only under plugins/extrachill-community/ (plus the writing rules file below); never list or read the repository root, other plugins, or vendor, build or test directories. Start from the existing articles in plugins/extrachill-community/docs/user/ and write each article as soon as you have grounded it, one topic at a time. Follow plugins/extrachill-docs/runner-configs/writing-rules.md in this repository verbatim as the network's voice standard: plain language, lead with the benefit, and never name plugins, tools, vendors, or anything technical. Write for forum members, music fans and contributors using the discussion boards, profiles, upvoting, ranks and notifications. Extra Chill has no follow feature or follower graph; never describe following users. Cover what the published Community help already covers so nothing is lost: getting started, using the forums, sharing music, setting up your profile, upvoting, community ranks, and notifications. Ground every article in current product behavior from the source under plugins/extrachill-community/."
