# Platform identity and Docs Agent configuration, keyed by monorepo plugin path.
# docs_subpath stays relative to the plugin for publishing and migration.
# runner is optional: only configured components appear in docs-agent.yml.
# Keep prompts, bootstrap contracts, writable paths and lane settings here.
# Legacy OWNER/REPO identities are derived by the PHP loader for existing pages.
plugins:

  plugins/extrachill-docs:
    platform_name: "Connect Your AI"
    parent_slug: "mcp"
    audience: "Extra Chill members connecting their own AI clients to network-wide capabilities"
    docs_subpath: "ec_docs/mcp"

  plugins/extrachill-artist-platform:
    platform_name: "Artist Platform"
    parent_slug: "artist-platform"
    audience: "musicians, artist managers, and small label staff who run artist pages, link pages, merch stores, and roster management on extrachill.com"
    docs_subpath: "docs/user"
    runner:
      audience: "user"
      run_kind: "bootstrap"
      base_ref: "main"
      docs_branch: "docs-agent/extrachill-artist-platform-user-docs"
      writable_paths: "plugins/extrachill-artist-platform/docs/user/**"
      context_repositories: []
      bootstrap_contract: {"required_globs": [{"pattern": "plugins/extrachill-artist-platform/docs/user/*.md", "min": 9}], "forbidden_phrases": ["following users"]}
      drift_checks: [{"command": "php plugins/extrachill-docs/scripts/check-user-docs-voice.php plugins/extrachill-artist-platform/docs/user", "description": "Extra Chill writing rules: no software, vendor, developer or code terms and no follow feature in end-user help (plugins/extrachill-docs/runner-configs/writing-rules.md)"}]
      prompt: "This repository is the Extra Chill monorepo; document only the plugin at plugins/extrachill-artist-platform/ and write only under plugins/extrachill-artist-platform/docs/user/. Follow plugins/extrachill-docs/runner-configs/writing-rules.md in this repository verbatim as the network's voice standard: plain language, lead with the benefit, and never name plugins, tools, vendors, or anything technical. Write for musicians, artist managers and small label staff running artist profiles, link pages, merch stores and rosters. Extra Chill has no follow feature or follower graph; never describe following users. Cover what the published Artist Platform help already covers so nothing is lost: getting started, managing link pages, advanced link page features, link page analytics, managing your roster, and artist access. Keep and improve the existing docs/user/artist-preferences.md. Ground every article in current product behavior from the source under plugins/extrachill-artist-platform/."
      model: "gpt-6-luna"

  plugins/extrachill-community:
    platform_name: "Community"
    parent_slug: "community"
    audience: "forum members, music fans, and contributors who use the discussion boards, profiles, ranks, upvoting, and notifications"
    docs_subpath: "docs/user"
    runner:
      audience: "user"
      run_kind: "bootstrap"
      base_ref: "main"
      docs_branch: "docs-agent/extrachill-community-user-docs"
      writable_paths: "plugins/extrachill-community/docs/user/**"
      context_repositories: []
      bootstrap_contract: {"required_globs": [{"pattern": "plugins/extrachill-community/docs/user/*.md", "min": 5}], "forbidden_phrases": ["following users"]}
      drift_checks: [{"command": "php plugins/extrachill-docs/scripts/check-user-docs-voice.php plugins/extrachill-community/docs/user", "description": "Extra Chill writing rules: no software, vendor, developer or code terms and no follow feature in end-user help (plugins/extrachill-docs/runner-configs/writing-rules.md)"}]
      prompt: "This repository is the Extra Chill monorepo; document only the plugin at plugins/extrachill-community/ and write only under plugins/extrachill-community/docs/user/. Follow plugins/extrachill-docs/runner-configs/writing-rules.md in this repository verbatim as the network's voice standard: plain language, lead with the benefit, and never name plugins, tools, vendors, or anything technical. Write for forum members, music fans and contributors using the discussion boards, profiles, upvoting, ranks and notifications. Extra Chill has no follow feature or follower graph; never describe following users. Cover what the published Community help already covers so nothing is lost: getting started, using the forums, sharing music, setting up your profile, upvoting, community ranks, and notifications. Ground every article in current product behavior from the source under plugins/extrachill-community/."
      model: "gpt-6-luna"

  plugins/extrachill-events:
    platform_name: "Events Calendar"
    parent_slug: "events-calendar"
    audience: "music fans browsing shows and festivals, and event organizers submitting their own events to the calendar"
    docs_subpath: "docs/user"
    runner:
      audience: "user"
      run_kind: "maintenance"
      base_ref: "main"
      docs_branch: "docs-agent/extrachill-events-user-docs"
      writable_paths: "plugins/extrachill-events/docs/user/**"
      context_repositories: []
      source_delta: [{"id": "events-product-surface", "source_refs": ["inc/**", "templates/**", "blocks/**"], "requires_documentation_change": false}]
      drift_checks: [{"command": "php plugins/extrachill-docs/scripts/check-user-docs-voice.php plugins/extrachill-events/docs/user", "description": "Extra Chill writing rules: no software, vendor, developer or code terms and no follow feature in end-user help (plugins/extrachill-docs/runner-configs/writing-rules.md)"}]
      prompt: "This repository is the Extra Chill monorepo; document only the plugin at plugins/extrachill-events/ and write only under plugins/extrachill-events/docs/user/. Follow plugins/extrachill-docs/runner-configs/writing-rules.md in this repository verbatim as the network's voice standard: plain language, lead with the benefit, and never name plugins, tools, vendors, or anything technical. Write for music fans browsing shows and festivals, and organizers submitting events. Extra Chill has no follow feature or follower graph; never describe following users. The 11 existing docs/user articles already back the published Events Calendar pages; update them where the product has changed rather than rewriting them, and keep their filenames so their pages update in place. Ground every article in current product behavior from the source under plugins/extrachill-events/."
      model: "gpt-6-luna"

  plugins/extrachill-newsletter:
    platform_name: "Newsletter"
    parent_slug: "newsletter"
    audience: "newsletter subscribers managing their preferences, and artists or organizers sending their own newsletters through Extra Chill"
    docs_subpath: "docs/user"
    runner:
      audience: "user"
      run_kind: "bootstrap"
      base_ref: "main"
      docs_branch: "docs-agent/extrachill-newsletter-user-docs"
      writable_paths: "plugins/extrachill-newsletter/docs/user/**"
      context_repositories: []
      bootstrap_contract: {"required_globs": [{"pattern": "plugins/extrachill-newsletter/docs/user/**/*.md", "min": 2}], "forbidden_phrases": ["following users"]}
      drift_checks: [{"command": "php plugins/extrachill-docs/scripts/check-user-docs-voice.php plugins/extrachill-newsletter/docs/user", "description": "Extra Chill writing rules: no software, vendor, developer or code terms and no follow feature in end-user help (plugins/extrachill-docs/runner-configs/writing-rules.md)"}]
      prompt: "This repository is the Extra Chill monorepo; document only the plugin at plugins/extrachill-newsletter/ and write only under plugins/extrachill-newsletter/docs/user/. Follow plugins/extrachill-docs/runner-configs/writing-rules.md in this repository verbatim as the network's voice standard: use plain language, lead with the benefit, and do not name plugins, tools, or vendors. Write for newsletter subscribers managing preferences and artists or organizers sending newsletters. Extra Chill has no follow feature or follower graph; never describe following users. There is no existing published help content for this platform to seed, so this is a true bootstrap. Ground all help in current product behavior."
      model: "gpt-6-luna"

  plugins/extrachill-shop:
    platform_name: "Shop"
    parent_slug: "shop"
    audience: "customers ordering merchandise and music from the Extra Chill shop, including artists fulfilling orders through their own merch stores"
    docs_subpath: "docs/user"

  plugins/extrachill-blog:
    platform_name: "Editorial"
    parent_slug: "blog"
    audience: "readers of the Extra Chill blog and contributors pitching stories or commenting on articles"
    docs_subpath: "docs/user"

  plugins/extrachill-roadie:
    platform_name: "Roadie"
    parent_slug: "chat"
    audience: "anyone chatting with the Extra Chill AI assistant, on the website or bridged through their personal messaging app"
    docs_subpath: "docs/user"

  plugins/extrachill-studio:
    platform_name: "Studio"
    parent_slug: "studio"
    audience: "Extra Chill team contributors and editors drafting, reviewing, and publishing editorial work"
    docs_subpath: "docs/user"
    post_status: "private"
