name: Homeboy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: homeboy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: Extra-Chill/homeboy-action/.github/workflows/ci.yml@v2
    with:
      commands: review lint
      expected-commands: review lint
    secrets: inherit
