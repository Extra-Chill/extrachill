name: Docs Agent

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the bootstrap without starting a live agent run'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  docs-agent:
    uses: Automattic/docs-agent/.github/workflows/maintain-docs.yml@main
    with:
      audience: user
      run_kind: bootstrap
      base_ref: main
      writable_paths: docs/user/**
      context_repositories: >-
        [{"alias":"docs-network","repository":"Extra-Chill/extrachill-docs"}]
      bootstrap_contract: >-
        {"required_globs":[{"pattern":"docs/user/**/*.md","min":2}],"forbidden_phrases":["following users"]}
      drift_checks: >-
        [{"command": "curl --fail --silent --show-error https://raw.githubusercontent.com/Extra-Chill/extrachill-docs/b6de069da1d2aff7dd3ebf00d86a85bdd6f3e9f0/scripts/check-user-docs-voice.php --output /tmp/ec-user-docs-voice.php && php /tmp/ec-user-docs-voice.php docs/user", "description": "Extra Chill writing rules: no software, vendor, developer or code terms and no follow feature in end-user help (extrachill-docs runner-configs/writing-rules.md)"}]
      prompt: >-
        Follow runner-configs/writing-rules.md in Extra-Chill/extrachill-docs verbatim as the network's voice standard: use plain language, lead with the benefit, and do not name plugins, tools, or vendors. Write for newsletter subscribers managing preferences and artists or organizers sending newsletters. Extra Chill has no follow feature or follower graph; never describe following users. There is no existing published help content for this platform to seed, so this is a true bootstrap. Ground all help in current product behavior.
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXTERNAL_PACKAGE_SOURCE_POLICY: ${{ secrets.DOCS_AGENT_EXTERNAL_PACKAGE_SOURCE_POLICY }}
